<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Short Arm Gradient (Left Piece) -->
    <linearGradient id="lf-short-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28baa7" />
      <stop offset="60%" stop-color="#1ea696" />
      <stop offset="100%" stop-color="#148578" />
    </linearGradient>

    <!-- Long Arm Gradient (Right Piece) -->
    <linearGradient id="lf-long-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a544c" />
      <stop offset="25%" stop-color="#116e64" />
      <stop offset="65%" stop-color="#199083" />
      <stop offset="100%" stop-color="#25ad9b" />
    </linearGradient>
  </defs>

  <g transform="translate(264, 302) scale(1.2) rotate(-45)">
    <!-- Short Arm (Left Piece) -->
    <rect 
      x="-94" 
      y="-179.5" 
      width="104" 
      height="120" 
      rx="32" 
      ry="32" 
      fill="url(#lf-short-grad)" 
    />

    <!-- Long Arm + Vertex (Right Piece) -->
    <rect 
      x="-94" 
      y="-52" 
      width="296" 
      height="104" 
      rx="32" 
      ry="32" 
      fill="url(#lf-long-grad)" 
    />
  </g>
</svg>
